<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema ATLTV Fibra</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 0; background:#F6F7FB; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    button { padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    /* Login overlay */
    #atltv-login-overlay{position:fixed;inset:0;z-index:999999;background:#0F172A;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,sans-serif}
    #atltv-sync{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#16A34A;color:white;padding:8px 14px;border-radius:9999px;font-size:11px;z-index:100000;font-family:Inter;font-weight:700}
    #atltv-users-modal{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:20px}
    #atltv-users-modal.open{display:flex}
    #atltv-users-box{background:white;border-radius:20px;width:100%;max-width:600px;max-height:80vh;overflow:auto;padding:20px;font-family:Inter,sans-serif}
    .atltv-input{width:100%;height:44px;border-radius:9999px;border:1px solid #E2E8F0;background:#F8FAFC;padding:0 16px;font-size:14px;outline:none;box-sizing:border-box}

    /* Popup de pagamento */
    #pago-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #pago-modal .box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
    }
    #pago-modal h3 { margin: 0 0 10px; }
    #pago-modal button { width: 100%; margin-top: 10px; height: 40px; font-weight: bold; }
    #btn-pago { background: #18181B; color: #fff; }
    #btn-bonus { background: #FEF3C7; border: 1px solid #F59E0B; color: #92400E; }
    #btn-cancelar { background: #F3F4F6; }
  </style>
</head>
<body>

<div id="atltv-sync">☁️ Online - Estável</div>

<!-- Login -->
<div id="atltv-login-overlay">
  <div style="width:100%;max-width:360px">
    <div style="background:white;border-radius:24px;overflow:hidden">
      <div style="background:#0B1220;padding:28px 24px;text-align:center">
        <h1 style="color:white;font-weight:800;font-size:20px;margin:0">ATLTV Fibra</h1>
        <div style="color:#22C55E;font-size:11px;font-weight:700;margin-top:6px">● ESTÁVEL V13</div>
      </div>
      <div style="padding:20px;background:white">
        <input id="atltv-user" class="atltv-input" placeholder="Usuário" value="admin" style="margin-bottom:10px">
        <input id="atltv-pass" class="atltv-input" type="password" placeholder="Senha" value="1234" style="margin-bottom:14px">
        <button id="atltv-login-btn"
          onclick="document.getElementById('atltv-login-overlay').style.display='none'; localStorage.setItem('atltv_logged_user', JSON.stringify({usuario:'admin'})); if(window.ensureButtons) window.ensureButtons();"
          style="width:100%;height:46px;background:#111;border:none;border-radius:9999px;color:white;font-weight:700;cursor:pointer">
          Entrar
        </button>
      </div>
    </div>
  </div>
</div>

<h2 style="padding:20px">Lista de Clientes</h2>
<table>
  <thead>
    <tr><th>Nome</th><th>Valor</th><th>Vencimento</th><th>Ação</th></tr>
  </thead>
  <tbody id="clientes"></tbody>
</table>

<!-- Popup -->
<div id="pago-modal">
  <div class="box">
    <h3>Confirmar pagamento?</h3>
    <p id="cliente-info"></p>
    <button id="btn-pago">✅ Pago - entra na receita</button>
    <button id="btn-bonus">🎁 Bônus - não entra</button>
    <button id="btn-cancelar">Cancelar</button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = "https://xmtkxvivqixqkcwvtcno.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

  const tbody = document.getElementById("clientes");
  let clientes = [
    {id:1, nome:"Maria", valor:100, vencimento:"2026-08-20"},
    {id:2, nome:"João", valor:150, vencimento:"2026-08-25"}
  ];
  clientes.forEach(c => {
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.nome}</td>
      <td>R$ ${c.valor}</td>
      <td>${c.vencimento}</td>
      <td><button onclick="abrirModal(${c.id})">Marcar PAGO</button></td>
    `;
    tbody.appendChild(tr);
  });

  let clienteSelecionado = null;
  window.abrirModal = function(id){
    clienteSelecionado = clientes.find(c => c.id===id);
    document.getElementById("cliente-info").textContent =
      `${clienteSelecionado.nome} - R$${clienteSelecionado.valor} - Venc: ${clienteSelecionado.vencimento}`;
    document.getElementById("pago-modal").style.display="flex";
  }

  function registrarPagamento(tipo){
    if(!clienteSelecionado) return;
    let hoje = new Date().toISOString().split("T")[0];
    let registro = {
      id: Date.now().toString(),
      cliente_id: clienteSelecionado.id,
      cliente_nome: clienteSelecionado.nome,
      valor: clienteSelecionado.valor,
      data_vencimento: clienteSelecionado.vencimento,
      data_pagamento: hoje,
      dias_atraso: 0,
      situacao: tipo
    };
    // LocalStorage
    let pagamentos = JSON.parse(localStorage.getItem("atltv_pagamentos") || "[]");
    pagamentos.push(registro);
    localStorage.setItem("atltv_pagamentos", JSON.stringify(pagamentos));
    // Supabase
    supabase.from("pagamentos").upsert(registro);
    alert(`Pagamento de ${clienteSelecionado.nome} marcado como ${tipo}`);
    document.getElementById("pago-modal").style.display="none";
  }

  document.getElementById("btn-pago").onclick = () => registrarPagamento("Pago");
  document.getElementById("btn-bonus").onclick = () => registrarPagamento("Bônus");
  document.getElementById("btn-cancelar").onclick = () => {
    document.getElementById("pago-modal").style.display="none";
  };
</script>
</body>
</html>
