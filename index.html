    for(let u of usuarios){

      try{ await supabase.from('usuarios').upsert({ id:u.id.toString(), usuario:(u.usuario||'').slice(0,50), nome:(u.nome||'').slice(0,100), email:(u.email||'').slice(0,100), senha:(u.senha||'').slice(0,100), perfil:(u.perfil||'Operador').slice(0,20), status:(u.status||'Ativo').slice(0,20), dados:u }, {onConflict:'id'}); }catch(e){}
    }
    lastPush=Date.now();
    syncEl.textContent='☁️ Online ✅ '+clientes.length+' cli, '+planos.length+' planos, '+usuarios.length+' users';
    syncEl.style.background='#16A34A';
  }catch(e){ syncEl.textContent='❌ '+e.message; syncEl.style.background='#EF4444'; }
  isPushing=false;
}

async function pullAll(silent=false){
  try{
    if(!silent){ syncEl.textContent='☁️ Verificando nuvem...'; }
    const {data:cliData} = await supabase.from('clientes').select('*').limit(1000);
    const {data:planosData} = await supabase.from('planos').select('*').limit(100);
    let usuariosData=[]; try{ const r=await supabase.from('usuarios').select('*').limit(100); if(r.data) usuariosData=r.data; }catch(e){}
    let hasNew=false;
    const localCli = getLS('atltv_clientes');
    const localPlanos = getLS('atltv_planos');
    const localUsers = getLS('atltv_usuarios');
    if(cliData && cliData.length>0 && (localCli.length===0 || cliData.length>=localCli.length)){
      const lista=cliData.filter(r=>!r.id.startsWith('SYNC_')).map(r=> r.dados_completos && r.dados_completos.nome ? r.dados_completos : { id:r.id, nome:r.nome, whatsapp:r.whatsapp, plano_nome:r.plano, valor:r.valor, data_vencimento:r.vencimento, status:r.status });
      if(lista.length>localCli.length){ localStorage.setItem('atltv_clientes', JSON.stringify(lista)); hasNew=true; }
    }
    if(planosData && planosData.length>localPlanos.length){
      const pLista=planosData.map(r=> r.dados && r.dados.nome ? r.dados : { id:r.id, nome:r.nome, descricao:r.velocidade||'', velocidade:r.velocidade||'', valor:r.valor||r.preco, preco:r.preco||r.valor, status:'Ativo' });
      if(pLista.length>localPlanos.length){ localStorage.setItem('atltv_planos', JSON.stringify(pLista)); hasNew=true; }
    }
    if(usuariosData && usuariosData.length>localUsers.length){
      const uLista=usuariosData.map(r=> r.dados && r.dados.usuario ? r.dados : { id:r.id, nome:r.nome, usuario:r.usuario, email:r.email, senha:r.senha, perfil:r.perfil, status:r.status });
      if(uLista.length>localUsers.length){ localStorage.setItem('atltv_usuarios', JSON.stringify(uLista)); hasNew=true; }
    }
    if(hasNew && !silent){
      syncEl.textContent='☁️ Novos dados da nuvem! Recarregue (F5) se quiser ver';
      syncEl.style.background='#F59E0B';
    } else if(!silent){
      syncEl.textContent='☁️ Online ✅ '+(cliData?.length||0)+' cli, '+(planosData?.length||0)+' planos';
      syncEl.style.background='#16A34A';
    }
  }catch(e){ console.log('pull erro', e.message); }
}

<script>
(function(){
window._cli=null;
function instala(){
  var btns = Array.from(document.querySelectorAll('button')).filter(function(b){ return b.textContent.trim()==='Marcar PAGO'; });
  var clis=[]; try{clis=JSON.parse(localStorage.getItem('atltv_clientes')||'[]')}catch(e){}
  btns.forEach(function(b){
    if(b.dataset.fix==='1') return;
    var n=b.cloneNode(true); n.dataset.fix='1';
    b.parentNode.replaceChild(n,b);
    n.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      // pega a linha (tr) desse botão
      var row = this.closest('tr');
      if(!row) row = this.closest('div'); // fallback
      // tenta pegar o nome da primeira coluna da linha
      var nomeNaLinha = '';
      if(row){
        // na sua tabela, o nome está na primeira célula
        var firstCell = row.querySelector('td') || row.children[0] || row;
        // se for tr, pega primeiro td
        if(row.tagName==='TR'){
          var tds = row.querySelectorAll('td');
          if(tds[0]) nomeNaLinha = tds[0].innerText.trim();
        } else {
          // tenta achar div com nome - pega texto até quebra de linha
          nomeNaLinha = (row.innerText.split('\n')[0] || '').trim();
          // se ainda não achou, tenta subir 2 níveis e pegar primeiro filho
          var parentRow = this.closest('div[class*="grid"]') || this.parentElement.parentElement;
          if(parentRow){
            var cells = parentRow.children;
            if(cells[0]) nomeNaLinha = cells[0].innerText.trim().split('\n')[0];
          }
        }
        // se ainda falhar, usa o texto da linha toda e procura
        if(!nomeNaLinha || nomeNaLinha.length<2){
          nomeNaLinha = row.innerText.trim().split('\n')[0];
        }
      }
      // agora acha o cliente pelo nome EXATO da linha
      var cli=null;
      for(var j=0;j<clis.length;j++){
        if(clis[j].nome.trim()===nomeNaLinha.trim()){ cli=clis[j]; break; }
      }
      // fallback: contains
      if(!cli){
        for(var j=0;j<clis.length;j++){
          if(nomeNaLinha.includes(clis[j].nome) || clis[j].nome.includes(nomeNaLinha)){ cli=clis[j]; break; }
        }
      }
      if(cli){
        window._cli=cli;
        document.getElementById('atltv-pago-nome').textContent=cli.nome+' - R$'+cli.valor+' - Venc: '+cli.data_vencimento;
        document.getElementById('atltv-pago-modal').style.display='flex';
      } else {
        alert('Não achei cliente: '+nomeNaLinha);
      }
    });
  });
}
setInterval(instala, 800);
window.darBaixa=function(tp){
  var c=window._cli; if(!c) return;
  var hoje=new Date().toISOString().split('T')[0];
  var pags=[]; try{pags=JSON.parse(localStorage.getItem('atltv_pagamentos')||'[]')}catch(e){}
  pags.unshift({id:'pg_'+Date.now(),cliente_id:c.id,cliente_nome:c.nome,valor:c.valor,data_vencimento:c.data_vencimento,data_pagamento:hoje,dias_atraso:0,situacao:tp});
  localStorage.setItem('atltv_pagamentos',JSON.stringify(pags));
  var clis=[]; try{clis=JSON.parse(localStorage.getItem('atltv_clientes')||'[]')}catch(e){}
  var d=new Date(c.data_vencimento+'T12:00:00'); d.setMonth(d.getMonth()+1);
  var prox=d.toISOString().split('T')[0];
  localStorage.setItem('atltv_clientes',JSON.stringify(clis.map(function(x){return x.id===c.id?Object.assign({},x,{data_vencimento:prox}):x})));
  document.getElementById('atltv-pago-modal').style.display='none';
  location.reload();
};
setTimeout(function(){
  document.getElementById('btn-pago-real').onclick=function(){window.darBaixa('Pago')};
  document.getElementById('btn-bonus-real').onclick=function(){window.darBaixa('Bônus')};
}, 1000);
})();
</script>
